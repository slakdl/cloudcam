<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cloudcam</title>
  <style>
    :root {
      --bg: #f5f4ef;
      --ink: #1a1a1a;
      --muted: #8f8c84;
      --placeholder: #cfccc4;
      --gap: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      padding: 32px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 32px;
      font-size: 13px;
    }

    h1 {
      font-size: 13px;
      font-weight: 600;
    }

    .count {
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 32px var(--gap);
      list-style: none;
    }

    .grid {
      align-items: start; /* photos keep their own height, so rows line up at the top */
    }

    /* One filter per camera. A new one appears by itself the first time a camera publishes. */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 20px;
      margin: -12px 0 32px;
      font-size: 13px;
      list-style: none;
    }

    .filters button {
      font: inherit;
      color: var(--muted);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    .filters button:hover,
    .filters button[aria-pressed="true"] {
      color: var(--ink);
    }

    .filters button[aria-pressed="true"] {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .filters .n {
      font-variant-numeric: tabular-nums;
      margin-left: 4px;
    }

    .photo {
      display: block;
      width: 100%;
      height: auto; /* the photo's own shape, never cropped */
      background: var(--placeholder); /* grey while the photo loads */
    }

    .caption {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }

    @media (max-width: 600px) {
      body { padding: 16px; }
      .grid { grid-template-columns: repeat(3, 1fr); gap: 24px 8px; }
      .caption { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <h1>i hope you continue to see the world that way</h1>
    <span class="count" id="count"></span>
  </header>

  <nav aria-label="Cameras">
    <ul class="filters" id="filters"></ul>
  </nav>

  <ul class="grid" id="grid"></ul>

  <script>
    // The camera app adds each published photo to photos.json, newest first:
    // [{ "src": "photos/2026-10-03-091512.jpg", "takenAt": "2026-10-03T09:15:12Z" }, ...]
    const pad = (n) => String(n).padStart(2, "0");
    const formatDate = (d) => `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`;
    const formatTime = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;

    const grid = document.getElementById("grid");
    const count = document.getElementById("count");
    const filters = document.getElementById("filters");
    let photos = [];

    function render() {
      // The chosen camera lives in the address (#pixel), so a filtered view can be shared.
      const chosen = decodeURIComponent(location.hash.slice(1)).toLowerCase();
      const shown = photos.filter((p) => !chosen || (p.camera || "").toLowerCase() === chosen);

      // Filters: "All", then every camera that has published, in the order they first appeared.
      const cameras = [];
      [...photos].reverse().forEach((p) => p.camera && !cameras.includes(p.camera) && cameras.push(p.camera));
      filters.replaceChildren(
        filterButton("All", "", photos.length, !chosen),
        ...cameras.map((c) => filterButton(c, c.toLowerCase(),
          photos.filter((p) => p.camera === c).length, chosen === c.toLowerCase()))
      );

      grid.replaceChildren(...shown.map((p) => {
        const li = document.createElement("li");
        const link = document.createElement("a");
        link.href = p.src;
        const img = document.createElement("img");
        img.className = "photo";
        img.src = p.src;
        img.alt = `Photo taken ${formatDate(p.takenAt)} at ${formatTime(p.takenAt)}${p.camera ? ` with ${p.camera}` : ""}`;
        img.loading = "lazy";
        link.append(img);
        const caption = document.createElement("div");
        caption.className = "caption";
        caption.innerHTML = `<span>${formatDate(p.takenAt)}</span><span>${formatTime(p.takenAt)}</span>`;
        li.append(link, caption);
        return li;
      }));
      count.textContent = shown.length === 1 ? "1 photo" : `${shown.length} photos`;
    }

    function filterButton(label, value, n, pressed) {
      const li = document.createElement("li");
      const button = document.createElement("button");
      button.setAttribute("aria-pressed", pressed);
      button.innerHTML = `${label}<span class="n">${n}</span>`;
      button.addEventListener("click", () => {
        if (value) location.hash = value;
        else history.replaceState(null, "", location.pathname);
        render();
      });
      li.append(button);
      return li;
    }

    window.addEventListener("hashchange", render);

    // Skip the browser cache, so a photo shows up as soon as the site has rebuilt.
    fetch(`photos.json?${Date.now()}`)
      .then((r) => (r.ok ? r.json() : []))
      .catch(() => [])
      .then((list) => {
        photos = list
          .map((p) => ({ ...p, takenAt: new Date(p.takenAt) }))
          .sort((a, b) => b.takenAt - a.takenAt); // newest first
        if (photos.length === 0) {
          count.textContent = "no photos yet";
          return;
        }
        render();
      });
  </script>
</body>
</html>
