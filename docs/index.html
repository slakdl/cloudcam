<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cloudcam</title>
  <style>
    :root {
      --bg: #f5f4ef;
      --ink: #1a1a1a;
      --muted: #8f8c84;
      --placeholder: #cfccc4;
      --gap: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      padding: 32px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 32px;
      font-size: 13px;
    }

    h1 {
      font-size: 13px;
      font-weight: 600;
    }

    .count {
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 32px var(--gap);
      list-style: none;
    }

    .photo {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: var(--placeholder); /* grey square until a real photo is set */
    }

    .caption {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }

    @media (max-width: 600px) {
      body { padding: 16px; }
      .grid { grid-template-columns: repeat(3, 1fr); gap: 24px 8px; }
      .caption { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <h1>cloudcam</h1>
    <span class="count" id="count"></span>
  </header>

  <ul class="grid" id="grid"></ul>

  <script>
    // Each photo: when it was taken, plus `src` once real uploads exist.
    // Without a src it shows as a grey square.
    const photos = placeholders(36);

    function placeholders(n) {
      // Fixed seed, so the placeholder dates stay the same between loads
      let seed = 7;
      const random = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      let t = new Date(2026, 9, 2, 21, 14).getTime();
      return Array.from({ length: n }, () => {
        t -= (20 + random() * 60 * 18) * 60 * 1000; // 20 minutes to ~18 hours apart
        return { takenAt: new Date(t) };
      });
    }

    const pad = (n) => String(n).padStart(2, "0");
    const formatDate = (d) => `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`;
    const formatTime = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;

    const grid = document.getElementById("grid");
    photos
      .sort((a, b) => b.takenAt - a.takenAt) // newest first
      .forEach((p) => {
        const li = document.createElement("li");
        const img = document.createElement(p.src ? "img" : "div");
        img.className = "photo";
        if (p.src) {
          img.src = p.src;
          img.alt = `Photo taken ${formatDate(p.takenAt)} at ${formatTime(p.takenAt)}`;
          img.loading = "lazy";
        }
        const caption = document.createElement("div");
        caption.className = "caption";
        caption.innerHTML = `<span>${formatDate(p.takenAt)}</span><span>${formatTime(p.takenAt)}</span>`;
        li.append(img, caption);
        grid.append(li);
      });

    document.getElementById("count").textContent = `${photos.length} photos`;
  </script>
</body>
</html>
